<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — DAMI-FOOD Marketing Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy:      #1E3A5F;
      --navy-dark: #152D4A;
      --steel:     #2E6DA4;
      --accent:    #1D6FD8;
      --bg:        #EFF4FB;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(160deg, var(--navy-dark) 0%, var(--navy) 50%, var(--steel) 100%);
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
    }

    .login-box {
      background: #ffffff;
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.2);
    }

    .login-logo {
      margin-bottom: 20px;
    }
    .login-logo img {
      width: 90px;
    }

    .login-title {
      color: var(--navy);
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .login-subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .login-box input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg);
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      color: var(--navy);
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      letter-spacing: 4px;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .login-box input[type="text"]::placeholder {
      letter-spacing: 1px;
      color: #cbd5e1;
      text-transform: none;
      font-size: 13px;
    }

    .login-box input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(29,111,216,0.1);
    }

    .login-box button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      background: var(--navy);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px rgba(30,58,95,0.25);
    }

    .login-box button:hover {
      background: var(--steel);
    }

    .login-box button:active {
      transform: scale(0.98);
      background: #f59e0b;
      color: #152D4A;
    }

    .error-msg {
      margin-top: 16px;
      padding: 12px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      color: #dc2626;
      font-size: 13px;
    }

    .divider {
      height: 1px;
      background: #e2e8f0;
      margin: 24px 0;
    }

    .back-link {
      display: block;
      color: #94a3b8;
      font-size: 12px;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--steel); }
  </style>
</head>
<body>
  <div class="login-box">

    <div class="login-logo">
      <img src="/static/images/brand/logo.png" alt="DA-MI FOOD">
    </div>
    <div class="login-title">DAMI-FOOD Marketing Portal</div>
    <div class="login-subtitle">임직원 전용 시스템입니다.<br>발급받은 직원 코드를 입력하세요.</div>

    <form method="POST" action="/portal/login">
      <input
        type="text"
        name="code"
        placeholder="직원 코드 입력"
        autocomplete="off"
        autofocus
        required
      >
      <button type="submit">입장하기 →</button>
    </form>

    {% if error %}
    <div class="error-msg">❌ {{ error }}</div>
    {% endif %}

    <div class="divider"></div>
    <a href="/" class="back-link">← 자사몰로 돌아가기</a>

  </div>
</body>
</html>
