{% extends "base_b2b.html" %}

{% block extra_css %}
<style>
  /* ── 아이디어 목록 그리드 (카드 뉴스 레이아웃) ── */
  #ideaList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    align-items: start; /* 카드가 제각각 높이를 가져도 자연스럽게 정렬 */
  }

  /* ── 아이디어 카드 ── */
  .idea-card {
    background: #fff;
    border: 1px solid #E8EDF3;
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    transition: box-shadow .25s ease, transform .25s ease, border-color .2s;
  }
  .idea-card:hover {
    box-shadow: 0 12px 32px -8px rgba(44,62,80,.12);
    transform: translateY(-4px);
    border-color: #BFDBFE;
  }

  /* 메타 정보 (프로필 이미지, 이름, 시간) */
  .idea-meta { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .idea-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #3B6FD4; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; flex-shrink: 0;
  }
  .idea-author { font-size:14px; font-weight:700; color:#1E293B; }
  .idea-date   { font-size:11px; color:#94A3B8; margin-top:2px; }

  .idea-title   { font-size:16px; font-weight:800; color:#1E293B; margin-bottom:12px; line-height:1.4; }

  /* 내용 더보기 (Expand) 핵심 로직 */
  .idea-content {
    font-size:14px; color:#475569; line-height:1.7;
    margin-bottom:20px; flex:1;
    display: -webkit-box;
    -webkit-line-clamp: 3; /* 기본 3줄까지만 보이고 ... 처리 */
    -webkit-box-orient: vertical;
    overflow: hidden;
    cursor: pointer;
    transition: color .2s;
  }
  .idea-content:hover { color: #1E293B; }
  .idea-content.expanded {
    display: block;
    -webkit-line-clamp: unset;
  }

  /* 카드 하단부 (버튼들) */
  .idea-footer  {
    display:flex; align-items:center; justify-content:space-between;
    padding-top:16px; border-top:1px solid #F1F5F9;
  }
  .like-btn {
    background:none; border:1px solid #E2E8F0; border-radius:99px;
    padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:6px; color:#64748B;
    transition: all .15s;
  }
  .like-btn:hover, .like-btn.liked { border-color:#FB7185; color:#E11D48; background:#FFF1F2; }

  .footer-actions { display: flex; align-items: center; gap: 12px; }
  .del-btn {
    background:none; border:none; color:#CBD5E1; font-size:12px;
    cursor:pointer; transition: color .15s;
  }
  .del-btn:hover { color:#EF4444; }
  .fav-btn {
    background:none; border:none; color:#3B6FD4; font-size:12px; font-weight:700;
    cursor:pointer; transition: color .15s;
  }
  .fav-btn:hover { color:#2A52A8; text-decoration: underline; }

  /* ── 작성 폼 (portal.css 완전 독립 전용 스타일) ── */
  .idea-form-wrap {
    background:#fff; border:1px solid #E8EDF3; border-radius:16px;
    padding:28px 32px; margin-bottom:32px;
    box-shadow: 0 4px 24px -8px rgba(44,62,80,.05);
  }
  .idea-form-title { font-size:18px; font-weight:800; color:#1E293B; margin-bottom:24px; }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  @media(max-width:768px){ .form-row { grid-template-columns: 1fr 1fr; } }
  @media(max-width:500px){ .form-row { grid-template-columns: 1fr; } }
  .full-row { margin-bottom: 16px; }

  /* 전용 라벨 */
  .if-label {
    display: block;
    font-size: 13px; font-weight: 600; color: #475569;
    margin-bottom: 8px;
  }

  /* 전용 input/select/textarea — portal.css 완전 무관 */
  .if-input, .if-select, .if-textarea {
    display: block;
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid #CBD5E1;
    border-radius: 10px;
    font-size: 14px;
    color: #1E293B;
    background: #fff;
    outline: none;
    font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
    box-sizing: border-box;
  }
  .if-input:focus, .if-select:focus, .if-textarea:focus {
    border-color: #3B6FD4;
    box-shadow: 0 0 0 3px rgba(59,111,212,.12);
  }
  .if-input::placeholder, .if-textarea::placeholder { color: #CBD5E1; }
  .if-textarea { resize: vertical; line-height: 1.6; }
  .if-select { cursor: pointer; }

  /* ── 필터 바 ── */
  .filter-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
  .filter-btn {
    border:1px solid #E2E8F0; border-radius:99px;
    padding:8px 18px; font-size:13px; font-weight:700; cursor:pointer;
    background:#fff; color:#64748B; transition:all .2s;
  }
  .filter-btn.active, .filter-btn:hover {
    background:#3B6FD4; border-color:#3B6FD4; color:#fff; box-shadow: 0 4px 12px rgba(59,111,212,.2);
  }

  /* ── 빈 상태 ── */
  .empty-state { text-align:center; padding:60px 24px; color:#94A3B8; grid-column: 1 / -1; }
  .empty-state .icon { font-size:48px; margin-bottom:16px; }

  /* ── 스켈레톤 ── */
  .skeleton { background:linear-gradient(90deg,#f0f4f8 25%,#e2e8f0 50%,#f0f4f8 75%); background-size:200%; animation:sk 1.4s infinite; border-radius:8px; }
  @keyframes sk { from{background-position:200%} to{background-position:-200%} }
</style>
{% endblock %}

{% block page_title %}{% endblock %}
{% block page_desc %}{% endblock %}

{% block content %}

<div class="idea-form-wrap">
  <div class="idea-form-title">💡 사내 아이디어 게시판</div>

  <!-- 1행: 이름 / 카테고리 / 파트 -->
  <div class="form-row">
    <div>
      <label class="if-label">이름</label>
      <input id="f-author" class="if-input" type="text" placeholder="홍길동" maxlength="20">
    </div>
    <div>
      <label class="if-label">카테고리</label>
      <select id="f-category" class="if-select">
        <option value="">카테고리 선택</option>
      </select>
    </div>
    <div>
      <label class="if-label">파트</label>
      <select id="f-part" class="if-select">
        <option value="">파트 선택</option>
      </select>
    </div>
  </div>

  <!-- 2행: 제목 -->
  <div class="full-row">
    <label class="if-label">제목</label>
    <input id="f-title" class="if-input" type="text" placeholder="아이디어 제목 (한 줄)" maxlength="60">
  </div>

  <!-- 3행: 내용 -->
  <div class="full-row">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <label class="if-label" style="margin-bottom:0;">내용</label>
      <span id="char-count" style="font-size:12px; color:#94A3B8;">(0/500자)</span>
    </div>
    <textarea id="f-content" class="if-textarea" rows="4" maxlength="500"
      placeholder="구체적으로 작성할수록 팀원들이 이해하기 쉬워요. 예) 베트남 현지 편의점 콜라보레이션 제안..."></textarea>
  </div>

  <!-- 4행: 참고 URL -->
  <div class="full-row">
    <label class="if-label">참고 URL <span style="font-size:11px; color:#94A3B8; font-weight:400;">(선택사항)</span></label>
    <input id="f-url" class="if-input" type="url" placeholder="https://참고할 링크를 입력하세요">
  </div>

  <!-- 등록 버튼 — 가운데 정렬 -->
  <div style="display:flex; justify-content:center; align-items:center; gap:12px; margin-top:8px;">
    <button class="btn-portal-action" onclick="submitIdea()" style="padding:11px 36px; font-size:14px; border-radius:10px;">아이디어 등록하기</button>
    <span id="form-msg" style="font-size:13px; font-weight:700; color:#10B981; display:none;"></span>
  </div>
</div>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-part="" onclick="setFilter('')">전체</button>
</div>

<div id="ideaList">
  <div class="idea-card">
    <div class="skeleton" style="height:36px;width:36px;border-radius:50%;margin-bottom:16px;"></div>
    <div class="skeleton" style="height:18px;width:70%;margin-bottom:16px;"></div>
    <div class="skeleton" style="height:14px;width:100%;margin-bottom:8px;"></div>
    <div class="skeleton" style="height:14px;width:80%;"></div>
  </div>
</div>

<div id="loadMoreWrap" style="text-align:center; margin-top:32px; display:none;">
  <button class="btn-portal-secondary" onclick="loadMore()" style="padding:10px 32px;">더 보기 ↓</button>
</div>

{% endblock %}

{% block extra_js %}
<script>
  // ── 상태
  let myName       = localStorage.getItem('ideas_name') || '';
  let activeFilter = '';
  let currentPage  = 1;
  const PER_PAGE   = 20;
  let totalItems   = 0;

  // ── XSS 방지
  function escHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }

  // ── 메타 로드 (카테고리 + 파트 드롭다운 + 필터탭)
  async function loadMeta() {
    try {
      const res  = await fetch('/api/intranet/ideas/meta');
      const data = await res.json();

      // 카테고리 드롭다운
      const catSel = document.getElementById('f-category');
      data.categories.forEach(c => {
        catSel.innerHTML += `<option value="${escHtml(c)}">${escHtml(c)}</option>`;
      });

      // 파트 드롭다운 — 라벨만 보이고 key 전송
      const partSel = document.getElementById('f-part');
      data.parts.forEach(p => {
        partSel.innerHTML += `<option value="${escHtml(p.key)}">${escHtml(p.label)}</option>`;
      });

      // 필터 버튼 생성 (라벨만 출력)
      const bar = document.getElementById('filterBar');
      data.parts.forEach(p => {
        bar.innerHTML += `<button class="filter-btn" data-part="${escHtml(p.key)}" onclick="setFilter('${p.key}')">${escHtml(p.label)}</button>`;
      });
    } catch(e) { console.error('[meta 로드 실패]', e); }
  }

  // ── 이름 자동복원
  if (myName) document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('f-author').value = myName;
  });

  // ── 글자수 카운터
  document.addEventListener('DOMContentLoaded', () => {
    const ta = document.getElementById('f-content');
    ta.addEventListener('input', () => {
      document.getElementById('char-count').textContent = `(${ta.value.length}/500자)`;
    });
  });

  // ── 필터 변경
  function setFilter(part) {
    activeFilter = part;
    currentPage  = 1;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.part === part);
    });
    loadIdeas(true);
  }

  // ── 아이디어 목록 로드 (카드 뉴스 형태)
  async function loadIdeas(reset = false) {
    if (reset) currentPage = 1;
    const params = new URLSearchParams({ page: currentPage, per_page: PER_PAGE });
    if (activeFilter) params.append('part', activeFilter);

    try {
      const res  = await fetch('/api/intranet/ideas?' + params.toString());
      const data = await res.json();
      totalItems = data.total;

      const list = document.getElementById('ideaList');
      if (reset) list.innerHTML = '';

      if (!data.ideas || data.ideas.length === 0) {
        if (reset) list.innerHTML = `
          <div class="empty-state">
            <div class="icon">🗂️</div>
            <div style="font-size:16px; font-weight:700; color:#475569; margin-bottom:8px;">아직 등록된 아이디어가 없어요</div>
            <div style="font-size:13px;">위 폼에서 첫 번째 아이디어를 등록해보세요!</div>
          </div>`;
        document.getElementById('loadMoreWrap').style.display = 'none';
        return;
      }

      data.ideas.forEach(idea => {
        const liked   = (idea.likes || []).includes(myName);
        const isOwner = idea.author === myName;
        // 이름의 첫 글자를 따서 아바타로 사용
        const initial = (idea.author || '익').charAt(0);

        // XSS 방어 처리된 문자열 안전 변수
        const safeId = escHtml(idea.id);
        const safeTitle = escHtml(idea.title).replace(/'/g, "\\'");
        const safeAuthor = escHtml(idea.author).replace(/'/g, "\\'");
        const safeDate = escHtml(idea.created_at || '방금 전').replace(/'/g, "\\'");

        list.innerHTML += `
          <div class="idea-card" id="card-${idea.id}">
            <div class="idea-meta">
              <div class="idea-avatar">${escHtml(initial)}</div>
              <div>
                <div class="idea-author">${escHtml(idea.author)}</div>
                <div class="idea-date">${escHtml(idea.created_at || '방금 전')}</div>
              </div>
            </div>
            
            <div class="idea-title">
              <span style="font-size:11px; color:#3B6FD4; font-weight:800; background:#EBF4FF; padding:3px 8px; border-radius:4px; margin-right:6px; vertical-align:middle;">${escHtml(idea.category || '공통')}</span>
              <span style="vertical-align:middle;">${escHtml(idea.title)}</span>
            </div>
            
            <div class="idea-content" onclick="this.classList.toggle('expanded')" title="클릭하면 내용이 펼쳐집니다">${escHtml(idea.content)}</div>
            
            ${idea.url ? `
            <a href="${escHtml(idea.url)}" target="_blank" rel="noopener noreferrer"
              style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#3B6FD4;font-weight:600;
                     background:#EBF4FF;border:1px solid #BFDBFE;border-radius:8px;padding:5px 10px;
                     margin-bottom:16px;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.15s;"
              onmouseover="this.style.background='#DBEAFE'" onmouseout="this.style.background='#EBF4FF'">
              🔗 참고 링크 바로가기
            </a>` : ''}

            <div class="idea-footer">
              <button class="like-btn ${liked ? 'liked' : ''}" onclick="toggleLike('${idea.id}', this)">
                ♡ <span class="like-count" style="margin-left:2px;">${(idea.likes || []).length}</span>
              </button>
              <div class="footer-actions">
                ${isOwner ? `<button class="del-btn" onclick="deleteIdea('${idea.id}')">삭제</button>` : ''}
              </div>
            </div>
          </div>`;
      });

      const loadedCount = (currentPage - 1) * PER_PAGE + data.ideas.length;
      const hasMore     = loadedCount < totalItems;
      document.getElementById('loadMoreWrap').style.display = hasMore ? 'block' : 'none';
    } catch(e) {
      console.error('[아이디어 로드 실패]', e);
      document.getElementById('ideaList').innerHTML = '<div class="empty-state">⚠️ 데이터를 불러오는 데 실패했습니다.</div>';
    }
  }

  // ── 더보기
  function loadMore() {
    currentPage++;
    loadIdeas(false);
  }

  // ── 아이디어 등록
  async function submitIdea() {
    const author   = document.getElementById('f-author').value.trim();
    const category = document.getElementById('f-category').value;
    const part     = document.getElementById('f-part').value;
    const title    = document.getElementById('f-title').value.trim();
    const content  = document.getElementById('f-content').value.trim();
    const url      = document.getElementById('f-url').value.trim();
    const msg      = document.getElementById('form-msg');

    if (!author || !category || !part || !title || !content) {
      showMsg(msg, '⚠️ 이름, 카테고리, 파트, 제목, 내용을 모두 입력해주세요.', '#EF4444'); return;
    }

    myName = author;
    localStorage.setItem('ideas_name', author);

    try {
      const res  = await fetch('/api/intranet/ideas', {
        method:  'POST',
        headers: {'Content-Type': 'application/json'},
        body:    JSON.stringify({ author, part, category, title, content, url: url || null }),
      });
      const data = await res.json();
      if (!res.ok) { showMsg(msg, '⚠️ ' + (data.detail || '등록 실패'), '#EF4444'); return; }

      showMsg(msg, '✅ 아이디어가 성공적으로 등록되었습니다!', '#10B981');
      document.getElementById('f-title').value   = '';
      document.getElementById('f-content').value = '';
      document.getElementById('f-url').value     = '';
      document.getElementById('char-count').textContent = '(0/500자)';
      loadIdeas(true);
    } catch(e) {
      showMsg(msg, '⚠️ 네트워크 오류', '#EF4444');
    }
  }

  // ── 좋아요 토글 (My Favorites 자동 연동)
  async function toggleLike(id, btn) {
    if (!myName) {
      alert('상단 폼에 이름을 먼저 입력해주세요.');
      document.getElementById('f-author').focus(); return;
    }
    try {
      const res  = await fetch(`/api/intranet/ideas/${id}`, {
        method:  'PUT',
        headers: {'Content-Type': 'application/json'},
        body:    JSON.stringify({ author: myName }),
      });
      const data = await res.json();
      if (data.success) {
        btn.classList.toggle('liked', data.action === 'like');
        btn.querySelector('.like-count').textContent = data.like_count;

        // ── My Favorites 자동 연동
      if (typeof addFavorite === 'function' && typeof removeFavorite === 'function') {
        const card   = btn.closest('.idea-card');
        const title  = card?.querySelector('.idea-title span:last-child')?.textContent || '';
        const author = card?.querySelector('.idea-author')?.textContent || '';
        const date   = card?.querySelector('.idea-date')?.textContent || '';

        if (data.action === 'like') {
          // 10개 초과 시 가장 오래된 것 자동 제거
          const favs = JSON.parse(localStorage.getItem('damiFoodFavorites') || '[]');
          if (favs.length >= 10) removeFavorite(favs.length - 1);
          addFavorite({ id, title, author, date });
        } else {
          // 하트 취소 시 My Favorites에서도 제거
          const favs = JSON.parse(localStorage.getItem('damiFoodFavorites') || '[]');
          const idx  = favs.findIndex(f => f.id === id);
          if (idx !== -1) removeFavorite(idx);
        }
      }
    }
  } catch(e) { console.error('[좋아요 오류]', e); }
}

  // ── 삭제
  async function deleteIdea(id) {
    if (!myName) { alert('작성자 이름을 폼에 먼저 확인해주세요.'); return; }
    if (!confirm('정말 이 아이디어를 삭제하시겠습니까?')) return;
    try {
      const res = await fetch(`/api/intranet/ideas/${id}?author=${encodeURIComponent(myName)}`, {
        method: 'DELETE'
      });
      const data = await res.json();
      if (data.success) {
        const card = document.getElementById(`card-${id}`);
        if (card) {
            card.style.transform = 'scale(0.9)';
            card.style.opacity = '0';
            setTimeout(() => { card.remove(); }, 200);
        }
        totalItems--;
        // My Favorites에서도 자동 제거
        const favs = JSON.parse(localStorage.getItem('damiFoodFavorites') || '[]');
        const idx  = favs.findIndex(f => f.id === id);
        if (idx !== -1) removeFavorite(idx);
      } else {
        alert(data.detail || '삭제 실패');
      }
    } catch(e) { console.error('[삭제 오류]', e); }
  }

  // ── 메시지 헬퍼
  function showMsg(el, text, color) {
    el.textContent    = text;
    el.style.color    = color;
    el.style.display  = 'inline-block';
    setTimeout(() => { el.style.display = 'none'; }, 3000);
  }

  // ── 초기화
  document.addEventListener('DOMContentLoaded', async () => {
    await loadMeta();
    await loadIdeas(true);
  });
</script>
{% endblock %}
