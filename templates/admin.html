<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Three Star</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f4f5f7; color: #333; }

/* 로그인 */
#loginSection { max-width: 400px; margin: 80px auto; background: white; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
#loginSection h2 { font-size: 18px; margin-bottom: 16px; color: #1a1a2e; }
#loginSection input {
    width: 100%; padding: 10px 14px; margin-bottom: 10px;
    border: 1px solid #ddd; border-radius: 6px; font-size: 14px;
}
#loginSection button {
    width: 100%; padding: 12px; background: #e74c3c; color: white;
    border: none; border-radius: 6px; cursor: pointer; font-size: 15px;
}
#loginSection button:hover { background: #c0392b; }
#loginError { color: #e74c3c; font-size: 13px; margin-top: 8px; display: none; }

/* 대시보드 */
#dashboard { display: none; }

/* 헤더 */
.header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: white; padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
}
.header h1 { font-size: 20px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.header select {
    padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.15); color: white; font-size: 13px; cursor: pointer;
}
.header select option { color: #333; background: white; }
.reset-btn {
    background: #95a5a6; color: white; border: none; padding: 8px 16px;
    border-radius: 6px; cursor: pointer; font-size: 13px; transition: background 0.2s;
}
.reset-btn:hover { background: #e74c3c; }
.logout-btn {
    background: #e74c3c; color: white; border: none; padding: 8px 16px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
}
.logout-btn:hover { background: #c0392b; }

/* 탭 */
.tab-bar {
    display: flex; gap: 0; background: #fff; border-bottom: 2px solid #eee;
    padding: 0 24px;
}
.tab-btn {
    padding: 12px 20px; border: none; background: none; font-size: 14px;
    cursor: pointer; color: #888; border-bottom: 3px solid transparent;
    transition: all 0.2s; font-weight: 600;
}
.tab-btn.active { color: #e74c3c; border-bottom-color: #e74c3c; }
.tab-btn:hover { color: #333; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.container { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
.card {
    background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.card h2 { font-size: 16px; margin-bottom: 14px; color: #1a1a2e; }

/* 통계 카드 */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 20px; }
.stat-card {
    background: white; border-radius: 10px; padding: 18px; text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.stat-value { font-size: 28px; font-weight: bold; color: #e74c3c; }
.stat-label { font-size: 13px; color: #888; margin-top: 4px; }

/* 차트 */
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.chart-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.chart-card h3 { font-size: 14px; margin-bottom: 12px; color: #1a1a2e; }

/* 랭킹 */
.rank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.rank-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.rank-card h3 { font-size: 14px; margin-bottom: 12px; color: #1a1a2e; }
.rank-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #f5f5f5; }
.rank-badge {
    width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold; flex-shrink: 0;
}
.rank-badge-1 { background: #FFF3E0; color: #E65100; }
.rank-badge-2 { background: #F3E5F5; color: #7B1FA2; }
.rank-badge-3 { background: #E3F2FD; color: #1565C0; }
.rank-badge-n { background: #f5f5f5; color: #888; }
.rank-name { flex: 1; font-size: 13px; }
.rank-count { font-size: 13px; font-weight: 600; color: #e74c3c; }
.no-data { color: #aaa; font-size: 13px; text-align: center; padding: 20px; }

/* 테이블 */
.recipe-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.recipe-table th { background: #f8f9fa; text-align: left; padding: 10px 8px; border-bottom: 2px solid #dee2e6; }
.recipe-table td { padding: 8px; border-bottom: 1px solid #eee; }
.recipe-table tr:hover { background: #fafbfc; }
.btn-edit {
    background: #3498db; color: white; border: none; padding: 4px 10px;
    border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 4px;
}
.btn-edit:hover { background: #2980b9; }
.btn-delete {
    background: #e74c3c; color: white; border: none; padding: 4px 10px;
    border-radius: 4px; cursor: pointer; font-size: 12px;
}
.btn-delete:hover { background: #c0392b; }

/* 모달 */
.modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center; z-index: 1000;
}
.modal-overlay.open { display: flex; }
.modal-box {
    background: white; border-radius: 12px; padding: 24px;
    max-width: 700px; width: 95%; max-height: 85vh; overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
.modal-box h2 { font-size: 18px; margin-bottom: 16px; color: #1a1a2e; }

/* 폼 */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
.form-grid input, .form-grid select, .form-grid textarea {
    width: 100%; padding: 8px 10px; border: 1px solid #ddd;
    border-radius: 6px; font-size: 13px;
}
.form-full { grid-column: 1 / -1; }
.form-full textarea {
    width: 100%; height: 120px; padding: 10px; border: 1px solid #ddd;
    border-radius: 6px; font-size: 13px; resize: vertical; font-family: monospace;
}
.modal-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
.submit-btn {
    background: #27ae60; color: white; border: none; padding: 10px 24px;
    border-radius: 6px; cursor: pointer; font-size: 14px;
}
.submit-btn:hover { background: #219a52; }
.cancel-btn {
    background: #95a5a6; color: white; border: none; padding: 10px 24px;
    border-radius: 6px; cursor: pointer; font-size: 14px;
}
.cancel-btn:hover { background: #7f8c8d; }

.toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #333; color: white; padding: 10px 20px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 9999;
}
.toast.show { opacity: 1; }

@media (max-width: 768px) {
    .chart-grid, .rank-grid, .stats-grid { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginSection">
    <h2>Three Star Admin</h2>
    <input type="text" id="loginUser" placeholder="Username">
    <input type="password" id="loginPass" placeholder="Password" onkeypress="if(event.key==='Enter') login()">
    <button onclick="login()">Login</button>
    <div id="loginError"></div>
</div>

<!-- 대시보드 -->
<div id="dashboard">
    <div class="header">
        <h1>Three Star Admin</h1>
        <div class="header-right">
            <select id="periodSelect" onchange="loadDashboard()">
                <option value="7">7일</option>
                <option value="14">14일</option>
                <option value="30">30일</option>
            </select>
            <button class="reset-btn" onclick="resetAnalytics()">🗑️ 초기화</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- 탭 바 -->
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">📊 대시보드</button>
        <button class="tab-btn" data-tab="recipes" onclick="switchTab('recipes')">🧑‍🍳 레시피 관리</button>
    </div>

    <!-- 탭 1: 대시보드 -->
    <div class="tab-content active" id="tabDashboard">
        <div class="container">
            <div class="stats-grid" id="statsGrid"></div>
            <div class="chart-grid">
                <div class="chart-card">
                    <h3>📈 일별 사용량</h3>
                    <canvas id="dailyChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3>🌐 언어별 분포</h3>
                    <canvas id="langChart"></canvas>
                </div>
            </div>
            <div class="rank-grid">
                <div class="rank-card">
                    <h3>🔥 인기 레시피 TOP 10</h3>
                    <div id="popularList"></div>
                </div>
                <div class="rank-card">
                    <h3>🛒 장바구니 TOP 10</h3>
                    <div id="cartList"></div>
                </div>
            </div>
            <div class="card">
                <h2>🍳 맛/카테고리 트렌드</h2>
                <div id="trendList"></div>
            </div>
        </div>
    </div>

    <!-- 탭 2: 레시피 관리 -->
    <div class="tab-content" id="tabRecipes">
        <div class="container">
            <div class="card">
                <h2>Recipes <span id="recipeCount" style="font-weight:normal;color:#888;font-size:14px;"></span></h2>
                <table class="recipe-table">
                    <thead>
                        <tr><th>ID</th><th>Name</th><th>Product</th><th>Category</th><th>Difficulty</th><th></th></tr>
                    </thead>
                    <tbody id="recipeTableBody"></tbody>
                </table>
            </div>

            <div class="card">
                <h2>Create Recipe</h2>
                <div class="form-grid">
                    <div>
                        <label>ID (recipe_xxx_000)</label>
                        <input type="text" id="newId" placeholder="recipe_my_dish_001">
                    </div>
                    <div>
                        <label>Name (Korean)</label>
                        <input type="text" id="newName" placeholder="매콤 쌀국수">
                    </div>
                    <div>
                        <label>Name (Vietnamese)</label>
                        <input type="text" id="newNameVn" placeholder="Phở cay">
                    </div>
                    <div>
                        <label>Name (English)</label>
                        <input type="text" id="newNameEn" placeholder="Spicy Pho">
                    </div>
                    <div>
                        <label>Product ID</label>
                        <input type="text" id="newProductId" placeholder="coin_01">
                    </div>
                    <div>
                        <label>Category</label>
                        <select id="newCategory">
                            <option value="면">면</option>
                            <option value="국물">국물</option>
                            <option value="구이">구이</option>
                            <option value="볶음">볶음</option>
                            <option value="밥">밥</option>
                            <option value="죽">죽</option>
                            <option value="샐러드">샐러드</option>
                            <option value="디저트">디저트</option>
                            <option value="음료">음료</option>
                            <option value="스낵">스낵</option>
                        </select>
                    </div>
                    <div>
                        <label>Taste (comma-separated)</label>
                        <input type="text" id="newTaste" placeholder="매운,얼큰">
                    </div>
                    <div>
                        <label>Difficulty</label>
                        <select id="newDifficulty">
                            <option value="쉬움">쉬움</option>
                            <option value="보통" selected>보통</option>
                            <option value="어려움">어려움</option>
                        </select>
                    </div>
                    <div>
                        <label>Cook Time</label>
                        <input type="text" id="newCookTime" placeholder="30분" value="30분">
                    </div>
                    <div class="form-full">
                        <label>Body (Markdown)</label>
                        <textarea id="newBody" placeholder="# Recipe Title&#10;&#10;## Ingredients&#10;- ...&#10;&#10;## Steps&#10;1. ..."></textarea>
                    </div>
                </div>
                <button class="submit-btn" onclick="createRecipe()">Create</button>
            </div>
        </div>
    </div>
</div>

<!-- 수정 모달 -->
<div class="modal-overlay" id="editModal" onclick="if(event.target===this) closeEditModal()">
    <div class="modal-box">
        <h2>레시피 수정</h2>
        <input type="hidden" id="editId">
        <div class="form-grid">
            <div>
                <label>Name (Korean)</label>
                <input type="text" id="editName">
            </div>
            <div>
                <label>Name (Vietnamese)</label>
                <input type="text" id="editNameVn">
            </div>
            <div>
                <label>Name (English)</label>
                <input type="text" id="editNameEn">
            </div>
            <div>
                <label>Product ID</label>
                <input type="text" id="editProductId">
            </div>
            <div>
                <label>Category</label>
                <select id="editCategory">
                    <option value="면">면</option>
                    <option value="국물">국물</option>
                    <option value="구이">구이</option>
                    <option value="볶음">볶음</option>
                    <option value="밥">밥</option>
                    <option value="죽">죽</option>
                    <option value="샐러드">샐러드</option>
                    <option value="디저트">디저트</option>
                    <option value="음료">음료</option>
                    <option value="스낵">스낵</option>
                </select>
            </div>
            <div>
                <label>Taste (comma-separated)</label>
                <input type="text" id="editTaste">
            </div>
            <div>
                <label>Difficulty</label>
                <select id="editDifficulty">
                    <option value="쉬움">쉬움</option>
                    <option value="보통">보통</option>
                    <option value="어려움">어려움</option>
                </select>
            </div>
            <div>
                <label>Cook Time</label>
                <input type="text" id="editCookTime">
            </div>
            <div class="form-full">
                <label>Body (Markdown)</label>
                <textarea id="editBody" style="height:150px;font-family:monospace;"></textarea>
            </div>
        </div>
        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeEditModal()">취소</button>
            <button class="submit-btn" onclick="saveEdit()">저장</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
var token = '';
var dailyChartInstance = null;
var langChartInstance = null;
var allRecipes = [];

function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2500);
}

// ─── 인증 ───
async function login() {
    var user = document.getElementById('loginUser').value;
    var pass = document.getElementById('loginPass').value;
    var errEl = document.getElementById('loginError');
    errEl.style.display = 'none';

    try {
        var res = await fetch('/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass })
        });
        if (!res.ok) {
            errEl.textContent = 'Invalid credentials';
            errEl.style.display = 'block';
            return;
        }
        var data = await res.json();
        token = data.access_token;
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadDashboard();
    } catch (e) {
        errEl.textContent = 'Connection error';
        errEl.style.display = 'block';
    }
}

function logout() {
    token = '';
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
}

function authHeaders() {
    return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
}

// ─── 탭 전환 ───
function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.tab === tab);
    });
    document.getElementById('tabDashboard').classList.toggle('active', tab === 'dashboard');
    document.getElementById('tabRecipes').classList.toggle('active', tab === 'recipes');

    if (tab === 'recipes') loadRecipes();
    if (tab === 'dashboard') loadDashboard();
}

// ─── 대시보드 ───
async function loadDashboard() {
    var days = document.getElementById('periodSelect').value;
    try {
        var [dailyRes, popularRes, cartRes, trendsRes, langRes, recipesRes] = await Promise.all([
            fetch('/analytics/daily?days=' + days, { headers: authHeaders() }),
            fetch('/analytics/popular?days=' + days, { headers: authHeaders() }),
            fetch('/analytics/cart?days=' + days, { headers: authHeaders() }),
            fetch('/analytics/trends?days=' + days, { headers: authHeaders() }),
            fetch('/analytics/languages?days=' + days, { headers: authHeaders() }),
            fetch('/admin/recipes', { headers: authHeaders() })
        ]);

        if (dailyRes.status === 401) { logout(); return; }

        var daily = await dailyRes.json();
        var popular = await popularRes.json();
        var cart = await cartRes.json();
        var trends = await trendsRes.json();
        var lang = await langRes.json();
        var recipesData = await recipesRes.json();

        // 통계 카드
        var totalEvents = daily.reduce(function(s, d) { return s + d.total; }, 0);
        var totalSearches = daily.reduce(function(s, d) { return s + d.searches; }, 0);
        var totalCarts = daily.reduce(function(s, d) { return s + d.carts; }, 0);
        var totalRecipes = recipesData.total || 0;

        document.getElementById('statsGrid').innerHTML =
            statCard(totalEvents, '총 이벤트') +
            statCard(totalSearches, '레시피 검색') +
            statCard(totalCarts, '장바구니 추가') +
            statCard(totalRecipes, '등록 레시피');

        // 일별 차트
        renderDailyChart(daily);

        // 언어 차트
        renderLangChart(lang);

        // 랭킹
        renderRankList('popularList', popular, 'name', 'count', '검색');
        renderRankList('cartList', cart, 'name', 'count', '추가');

        // 트렌드
        renderRankList('trendList', trends, 'combination', 'count', '검색');

    } catch (e) {
        showToast('대시보드 로드 실패');
    }
}

function statCard(value, label) {
    return '<div class="stat-card"><div class="stat-value">' + value + '</div><div class="stat-label">' + label + '</div></div>';
}

function renderDailyChart(data) {
    var ctx = document.getElementById('dailyChart').getContext('2d');
    if (dailyChartInstance) dailyChartInstance.destroy();

    dailyChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: data.map(function(d) { return d.date.slice(5); }),
            datasets: [
                {
                    label: '검색',
                    data: data.map(function(d) { return d.searches; }),
                    borderColor: '#e74c3c',
                    backgroundColor: 'rgba(231,76,60,0.1)',
                    fill: true,
                    tension: 0.3
                },
                {
                    label: '장바구니',
                    data: data.map(function(d) { return d.carts; }),
                    borderColor: '#3498db',
                    backgroundColor: 'rgba(52,152,219,0.1)',
                    fill: true,
                    tension: 0.3
                }
            ]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true, ticks: { stepSize: 1 } }
            }
        }
    });
}

function renderLangChart(data) {
    var ctx = document.getElementById('langChart').getContext('2d');
    if (langChartInstance) langChartInstance.destroy();

    var langNames = { ko: '한국어', vi: 'Tiếng Việt', en: 'English' };
    var colors = ['#e74c3c', '#27ae60', '#3498db', '#f39c12', '#9b59b6'];

    if (!data.length) {
        ctx.canvas.parentElement.innerHTML += '<div class="no-data">데이터 없음</div>';
        return;
    }

    langChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: data.map(function(d) { return langNames[d.language] || d.language; }),
            datasets: [{
                data: data.map(function(d) { return d.count; }),
                backgroundColor: colors.slice(0, data.length)
            }]
        },
        options: { responsive: true }
    });
}

function renderRankList(elementId, data, nameKey, countKey, unit) {
    var el = document.getElementById(elementId);
    if (!data.length) {
        el.innerHTML = '<div class="no-data">데이터 없음</div>';
        return;
    }
    el.innerHTML = data.map(function(item, i) {
        var badgeClass = i === 0 ? 'rank-badge-1' : i === 1 ? 'rank-badge-2' : i === 2 ? 'rank-badge-3' : 'rank-badge-n';
        return '<div class="rank-item">' +
            '<span class="rank-badge ' + badgeClass + '">' + (i + 1) + '</span>' +
            '<span class="rank-name">' + (item[nameKey] || '-') + '</span>' +
            '<span class="rank-count">' + item[countKey] + ' ' + unit + '</span>' +
            '</div>';
    }).join('');
}

// ─── 레시피 관리 ───
async function loadRecipes() {
    try {
        var res = await fetch('/admin/recipes', { headers: authHeaders() });
        if (res.status === 401) { logout(); return; }
        var data = await res.json();
        allRecipes = data.recipes;
        document.getElementById('recipeCount').textContent = '(' + data.total + ')';
        var tbody = document.getElementById('recipeTableBody');
        tbody.innerHTML = '';
        data.recipes.forEach(function(r) {
            var tr = document.createElement('tr');
            tr.innerHTML =
                '<td><code>' + r.id + '</code></td>' +
                '<td>' + r.name + '</td>' +
                '<td>' + r.product_id + '</td>' +
                '<td>' + r.category + '</td>' +
                '<td>' + r.difficulty + '</td>' +
                '<td>' +
                '<button class="btn-edit" onclick="openEditModal(\'' + r.id + '\')">수정</button>' +
                '<button class="btn-delete" onclick="deleteRecipe(\'' + r.id + '\')">삭제</button>' +
                '</td>';
            tbody.appendChild(tr);
        });
    } catch (e) {
        showToast('Failed to load recipes');
    }
}

function openEditModal(id) {
    var r = allRecipes.find(function(x) { return x.id === id; });
    if (!r) return;
    document.getElementById('editId').value = r.id;
    document.getElementById('editName').value = r.name || '';
    document.getElementById('editNameVn').value = r.name_vn || '';
    document.getElementById('editNameEn').value = r.name_en || '';
    document.getElementById('editProductId').value = r.product_id || '';
    document.getElementById('editCategory').value = r.category || '면';
    document.getElementById('editTaste').value = r.taste || '';
    document.getElementById('editDifficulty').value = r.difficulty || '보통';
    document.getElementById('editCookTime').value = r.cook_time || '';
    document.getElementById('editBody').value = r.body || '';
    document.getElementById('editModal').classList.add('open');
}

function closeEditModal() {
    document.getElementById('editModal').classList.remove('open');
}

async function saveEdit() {
    var id = document.getElementById('editId').value;
    var body = {
        name: document.getElementById('editName').value,
        name_vn: document.getElementById('editNameVn').value,
        name_en: document.getElementById('editNameEn').value,
        product_id: document.getElementById('editProductId').value,
        category: document.getElementById('editCategory').value,
        taste: document.getElementById('editTaste').value,
        difficulty: document.getElementById('editDifficulty').value,
        cook_time: document.getElementById('editCookTime').value,
        body: document.getElementById('editBody').value
    };

    try {
        var res = await fetch('/admin/recipes/' + id, {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify(body)
        });
        if (res.status === 401) { logout(); return; }
        if (!res.ok) {
            var err = await res.json();
            showToast('Error: ' + (err.detail || 'Failed'));
            return;
        }
        showToast('레시피 저장 완료!');
        closeEditModal();
        loadRecipes();
    } catch (e) {
        showToast('Connection error');
    }
}

async function createRecipe() {
    var body = {
        id: document.getElementById('newId').value,
        name: document.getElementById('newName').value,
        name_vn: document.getElementById('newNameVn').value,
        name_en: document.getElementById('newNameEn').value,
        product_id: document.getElementById('newProductId').value,
        category: document.getElementById('newCategory').value,
        taste: document.getElementById('newTaste').value,
        difficulty: document.getElementById('newDifficulty').value,
        cook_time: document.getElementById('newCookTime').value,
        body: document.getElementById('newBody').value
    };

    if (!body.id || !body.name) {
        showToast('ID and Name are required');
        return;
    }

    try {
        var res = await fetch('/admin/recipes', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify(body)
        });
        if (res.status === 401) { logout(); return; }
        if (!res.ok) {
            var err = await res.json();
            showToast('Error: ' + (err.detail || 'Failed'));
            return;
        }
        showToast('Recipe created!');
        document.getElementById('newId').value = '';
        document.getElementById('newName').value = '';
        document.getElementById('newNameVn').value = '';
        document.getElementById('newNameEn').value = '';
        document.getElementById('newBody').value = '';
        loadRecipes();
    } catch (e) {
        showToast('Connection error');
    }
}

async function resetAnalytics() {
    if (!confirm('정말 모든 분석 데이터를 삭제하시겠습니까?')) return;
    try {
        var res = await fetch('/analytics/reset', {
            method: 'DELETE',
            headers: authHeaders()
        });
        if (res.status === 401) { logout(); return; }
        if (!res.ok) { showToast('초기화 실패'); return; }
        showToast('데이터 초기화 완료');
        loadDashboard();
    } catch (e) {
        showToast('초기화 실패');
    }
}

async function deleteRecipe(id) {
    if (!confirm('Delete recipe: ' + id + '?')) return;
    try {
        var res = await fetch('/admin/recipes/' + id, {
            method: 'DELETE',
            headers: authHeaders()
        });
        if (res.status === 401) { logout(); return; }
        if (!res.ok) {
            showToast('Delete failed');
            return;
        }
        showToast('Deleted: ' + id);
        loadRecipes();
    } catch (e) {
        showToast('Connection error');
    }
}
</script>
</body>
</html>
