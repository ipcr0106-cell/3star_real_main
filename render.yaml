services:
  - type: web
    name: threestar-chatbot
    runtime: python
    buildCommand: pip install -r requirements.txt && mkdir -p data && cp /etc/secrets/admins.json data/admins.json
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.7"
